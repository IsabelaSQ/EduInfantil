<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/livro.css">
  <title>Caderno de Exploração</title>
</head>
<body class="bg-livro">

  <section id="page-livro" class="page active">
    <aside class="sidebar">
    <button class="sidebar-btn active" title="Caderno">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    </button>
    <button class="sidebar-btn" title="Início">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
    </button>
    <button class="sidebar-btn" title="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    </button>
    <button class="sidebar-btn" title="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button class="sidebar-btn" title="Info">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </button>
  </aside>
 
  <!-- MAIN APP -->
  <div class="app">
 
    <!-- HEADER -->
    <header class="header">
      <button class="btn-back" id="btnBack" title="Voltar" onclick="App.goTo('mapa')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
         <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
 
      <h1 class="header-title" id="headerTitle">Caderno de Exploração</h1>
 
      <button class="btn-search" id="btnLang" title="Mudar idioma">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </header>
 
    <!-- PANELS -->
    <main class="panels">
 
      <!-- BR PANEL -->
      <section class="panel panel-br" id="panelBR">
        <div class="panel-header">
          <div class="panel-label">
            <span class="flag-badge br">BR</span>
            <span class="panel-title" data-pt="Minhas Descobertas" data-en="My Discoveries (PT)">Minhas Descobertas</span>
          </div>
          <span class="counter" id="counterBR">0/8</span>
        </div>
 
        <div class="grid" id="gridBR">
          <!-- Cards injected by JS -->
        </div>
 
        <!-- Page dots -->
        <div class="page-dots" id="dotsBR"></div>
      </section>
 
      <!-- DIVIDER -->
      <div class="divider"></div>
 
      <!-- GB PANEL -->
      <section class="panel panel-gb" id="panelGB">
        <div class="panel-header">
          <div class="panel-label">
            <span class="flag-badge gb">GB</span>
            <span class="panel-title" data-pt="My Discoveries" data-en="My Discoveries">My Discoveries</span>
          </div>
          <span class="counter" id="counterGB">0/8</span>
        </div>
 
        <div class="grid" id="gridGB">
          <!-- Cards injected by JS -->
        </div>
      </section>
 
    </main>
 
    <!-- FOOTER -->
    <footer class="footer">
      <span class="footer-count" id="footerCount">0 de 8 figurinhas</span>
      <button class="btn-print" id="btnPrint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span data-pt="Imprimir Página" data-en="Print Page">Imprimir Página</span>
      </button>
    </footer>
 
  </div>
  </section>

  <script src="../assets/javascript/script.js"></script>
</body>
</html>
