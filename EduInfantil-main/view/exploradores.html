<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <title>Exploradores</title>
</head>
<body>
  <section id="page-exploradores" class="page active">
    <div class="section-logo">
      <span style="font-size:2rem">🦉</span>
      <span>Safari Alpha</span>
    </div>

    <div class="white-card">
      <h2>Quem está explorando?</h2>
      <p class="subtitle">Clique no seu Explorador</p>

      <div class="explorers-grid" id="explorers-grid">
        <!-- Gerado via JS -->
      </div>

      <button id="btnNovoExplorador" class="btn-novo" onclick="App.novoExplorador()">
        <span>＋</span> Criar Novo Explorador
      </button>
    </div>
  </section>

  <div class="modal-overlay" id="modal-overlay" style="display:none;" onclick="App.closeModal()">
    <div class="modal" id="modal-box" onclick="event.stopPropagation()">
      <div class="modal-emoji" id="modal-emoji">🎮</div>
      <h3 id="modal-title">Título</h3>
      <p id="modal-desc">Descrição</p>
      <div class="modal-btns">
        <button class="btn-modal secondary" onclick="App.closeModal()">Fechar</button>
        <button class="btn-modal primary" id="modal-action">Jogar!</button>
      </div>
    </div>
  </div>

  <script src="../assets/javascript/script.js"></script>
</body>
</html>
