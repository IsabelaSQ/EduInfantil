<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/style.css">
  <title>Document</title>
</head>
<body>
<section id="page-mapa" class="page active">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-user">
        <div class="topbar-avatar" id="topbar-avatar">🧒</div>
        <span class="topbar-name" id="topbar-name">Explorador</span>
      </div>
      <button class="topbar-search" onclick="App.openSearch()">🔍</button>
    </header>

    <!-- Mapa de seções / fases -->
    <main class="mapa-scroll" id="mapa-scroll">

      <!-- Fazendinha -->
      <div class="mapa-section fazendinha">
        <div class="section-header">
          <div class="section-icon">🐄</div>
          <div class="section-info">
            <div class="section-name">Fazendinha</div>
            <div class="section-status">Primeiras letras do campo</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row" data-section="fazendinha">
            <div class="level-bubble done" onclick="App.openLevel('fazendinha',1)">
              A <span class="star-badge">⭐</span>
            </div>
            <div class="level-bubble done" onclick="App.openLevel('fazendinha',2)">
              E <span class="star-badge">⭐</span>
            </div>
            <div class="level-bubble current" onclick="App.openLevel('fazendinha',3)">I</div>
            <div class="level-bubble locked">O</div>
            <div class="level-bubble locked">U</div>
          </div>
        </div>
      </div>

      <!-- Floresta -->
      <div class="mapa-section floresta">
        <div class="section-header">
          <div class="section-icon">🌳</div>
          <div class="section-info">
            <div class="section-name">Floresta</div>
            <div class="section-status">Aventure-se na floresta</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row">
            <div class="level-bubble locked">B</div>
            <div class="level-bubble locked">D</div>
            <div class="level-bubble locked">F</div>
            <div class="level-bubble locked">G</div>
            <div class="level-bubble locked">H</div>
          </div>
        </div>
      </div>

      <!-- Savana -->
      <div class="mapa-section savana">
        <div class="section-header">
          <div class="section-icon">🦁</div>
          <div class="section-info">
            <div class="section-name">Savana</div>
            <div class="section-status">Aprenda no calor da savana</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row">
            <div class="level-bubble current" onclick="App.openLevel('savana', 1)">M</div>
            <div class="level-bubble current" onclick="App.openLevel('savana', 2)">N</div>
            <div class="level-bubble locked">P</div>
            <div class="level-bubble locked">R</div>
            <div class="level-bubble locked">S</div>
          </div>
        </div>
      </div>

      <!-- Fundo do Mar -->
      <div class="mapa-section mar">
        <div class="section-header">
          <div class="section-icon">🐠</div>
          <div class="section-info">
            <div class="section-name">Fundo do Mar</div>
            <div class="section-status">Mergulhe no conhecimento</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row">
            <div class="level-bubble current" onclick="App.openLevel('mar', 1)">T</div>
            <div class="level-bubble locked">V</div>
            <div class="level-bubble locked">X</div>
            <div class="level-bubble locked">Z</div>
            <div class="level-bubble locked">+</div>
          </div>
        </div>
      </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="App.setNav(this); App.abrirMapaIlustrado()">
        <span class="nav-icon">🗺️</span> Mapa
      </button>
      
      <button class="nav-item" onclick="App.goTo('livro')">
        <span class="nav-icon">📖</span> Livro do Explorador
      </button>
      
      <button class="nav-item" onclick="App.goTo('home')">
        <span class="nav-icon">🚪</span> Sair
      </button>
    </nav>

    <!-- Modal de detalhes do nível -->
  </nav>
  </section>

  <div class="modal-overlay" id="modal-overlay" onclick="App.closeModal(event)">
    <div class="modal" id="modal-box" onclick="event.stopPropagation()">
      <div class="modal-emoji" id="modal-emoji">🎮</div>
      <h3 id="modal-title">Título</h3>
      <p id="modal-desc">Descrição</p>
      
      <div class="modal-btns">
        <button class="btn-modal secondary" onclick="App.closeModal()">Fechar</button>
        <button class="btn-modal primary" id="modal-action">Jogar!</button>
      </div>
    </div>
  </div>

  <script src="../assets/javascript/script.js"></script>
</body>
</html>
>
