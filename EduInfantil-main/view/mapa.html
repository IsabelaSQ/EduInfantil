<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <title>Safari Alpha - Mapa</title>
</head>
<body>

  <section id="page-mapa" class="page active">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-user">
        <div class="topbar-avatar" id="topbar-avatar">🧒</div>
        <div>
          <span class="topbar-name" id="topbar-name">Explorador</span>
          <div class="topbar-coins">🟡 <span id="topbar-coins">0</span></div>
        </div>
      </div>
      <button class="topbar-search" onclick="App.openSearch()">🔍</button>
      <button class="topbar-search" onclick="window.location.href='ranking.html'" title="Ranking">🏆</button>
    </header>

    <!-- Mapa de seções / fases -->
    <main class="mapa-scroll" id="mapa-scroll">

      <!-- Fazendinha -->
      <div class="mapa-section fazendinha">
        <div class="section-header">
          <div class="section-icon">🐄</div>
          <div class="section-info">
            <div class="section-name">Fazendinha</div>
            <div class="section-status">Primeiras letras do campo</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row" data-section="fazendinha">
            <div class="level-bubble" data-section="fazendinha" data-level="1" onclick="App.openLevel('fazendinha',1)">
              A <span class="stars"></span>
            </div>
            <div class="level-bubble" data-section="fazendinha" data-level="2" onclick="App.openLevel('fazendinha',2)">
              E <span class="stars"></span>
            </div>
            <div class="level-bubble" data-section="fazendinha" data-level="3" onclick="App.openLevel('fazendinha',3)">
              I <span class="stars"></span>
            </div>
            <div class="level-bubble locked" data-section="fazendinha" data-level="4">
              O <span class="stars"></span>
            </div>
            <div class="level-bubble locked" data-section="fazendinha" data-level="5">
              U <span class="stars"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Floresta -->
      <div class="mapa-section floresta">
        <div class="section-header">
          <div class="section-icon">🌳</div>
          <div class="section-info">
            <div class="section-name">Floresta</div>
            <div class="section-status">Aventure-se na floresta</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row">
            <div class="level-bubble" data-section="floresta" data-level="1" onclick="App.openLevel('floresta',1)">B <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="floresta" data-level="2">D <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="floresta" data-level="3">F <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="floresta" data-level="4">G <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="floresta" data-level="5">H <span class="stars"></span></div>
          </div>
        </div>
      </div>

      <!-- Savana -->
      <div class="mapa-section savana">
        <div class="section-header">
          <div class="section-icon">🦁</div>
          <div class="section-info">
            <div class="section-name">Savana</div>
            <div class="section-status">Aprenda no calor da savana</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row">
            <div class="level-bubble" data-section="savana" data-level="1" onclick="App.openLevel('savana',1)">M <span class="stars"></span></div>
            <div class="level-bubble" data-section="savana" data-level="2" onclick="App.openLevel('savana',2)">N <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="savana" data-level="3">P <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="savana" data-level="4">R <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="savana" data-level="5">S <span class="stars"></span></div>
          </div>
        </div>
      </div>

      <!-- Fundo do Mar -->
      <div class="mapa-section mar">
        <div class="section-header">
          <div class="section-icon">🐠</div>
          <div class="section-info">
            <div class="section-name">Fundo do Mar</div>
            <div class="section-status">Mergulhe no conhecimento</div>
          </div>
        </div>
        <div class="section-body">
          <div class="levels-row">
            <div class="level-bubble" data-section="mar" data-level="1" onclick="App.openLevel('mar',1)">T <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="mar" data-level="2">V <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="mar" data-level="3">X <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="mar" data-level="4">Z <span class="stars"></span></div>
            <div class="level-bubble locked" data-section="mar" data-level="5">+ <span class="stars"></span></div>
          </div>
        </div>
      </div>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="App.setNav(this); App.abrirMapaIlustrado()">
        <span class="nav-icon">🗺️</span> Mapa
      </button>
      <button class="nav-item" onclick="App.goTo('livro')">
        <span class="nav-icon">📖</span> Livro do Explorador
      </button>
      <button class="nav-item" onclick="App.logout()">
        <span class="nav-icon">🚪</span> Sair
      </button>
    </nav>

  </section>

  <!-- Modal de detalhes do nível -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;" onclick="App.closeModal()">
    <div class="modal" id="modal-box" onclick="event.stopPropagation()">
      <div class="modal-emoji" id="modal-emoji">🎮</div>
      <h3 id="modal-title">Título</h3>
      <p id="modal-desc">Descrição</p>
      <div class="modal-btns">
        <button class="btn-modal secondary" onclick="App.closeModal()">Fechar</button>
        <button class="btn-modal primary" id="modal-action">Jogar!</button>
      </div>
    </div>
  </div>

  <script src="../assets/javascript/script.js"></script>
</body>
</html>
