<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>Document</title>
  </head>
  <body>
    <section id="page-pais" class="page active">
      <div class="section-logo" style="margin-bottom: 20px">
        <span style="font-size: 2rem">🦉</span>
        <span>Safari Alpha</span>
      </div>

      <div class="pais-card">
        <h2>Portal dos Pais</h2>
        <p class="subtitle">Acompanhe o progresso da criança</p>

        <!-- Stats rápidas -->
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-number">3</div>
            <div class="stat-label">Fases concluídas</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">​2</div>
            <div class="stat-label">Figurinhas ganhas</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">5</div>
            <div class="stat-label">Dias seguidos</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">3</div>
            <div class="stat-label">Estrelas obtidas</div>
          </div>
        </div>

        <!-- Barra de progresso por seção -->
        <div class="progress-section">
          <h3>Progresso por Seção</h3>

          <div class="progress-item">
            <span class="progress-label">Fazendinha</span>
            <div class="progress-bar-bg">
              <div
                class="progress-bar-fill"
                style="
                  width: 40%;
                  background: linear-gradient(90deg, #f59e0b, #d97706);
                "
              ></div>
            </div>
            <span class="progress-pct">40%</span>
          </div>

          <div class="progress-item">
            <span class="progress-label">Floresta</span>
            <div class="progress-bar-bg">
              <div
                class="progress-bar-fill"
                style="
                  width: 0%;
                  background: linear-gradient(90deg, #10b981, #059669);
                "
              ></div>
            </div>
            <span class="progress-pct">0%</span>
          </div>

          <div class="progress-item">
            <span class="progress-label">Savana</span>
            <div class="progress-bar-bg">
              <div
                class="progress-bar-fill"
                style="
                  width: 20%;
                  background: linear-gradient(90deg, #ef4444, #dc2626);
                "
              ></div>
            </div>
            <span class="progress-pct">20%</span>
          </div>

          <div class="progress-item">
            <span class="progress-label">Fundo Mar</span>
            <div class="progress-bar-bg">
              <div
                class="progress-bar-fill"
                style="
                  width: 10%;
                  background: linear-gradient(90deg, #3b82f6, #2563eb);
                "
              ></div>
            </div>
            <span class="progress-pct">10%</span>
          </div>
        </div>

        <button class="btn-sair" onclick="App.goTo('home')">
          ← Voltar ao Início
        </button>
      </div>
    </section>

    <script src="../assets/javascript/script.js"></script>
  </body>
</html>
