<!DOCTYPE html>
<html lang="pt.br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/style.css">
    <title>Document</title>
</head>
<body>
  <section id="page-senha" class="page active">
    <div class="section-logo" style="margin-bottom:16px">
      <span style="font-size:2rem">🦉</span>
      <span>Safari Alpha</span>
    </div>

    <h2>Senha dos Bichinhos</h2>
    <p class="subtitle">Escolha seus 3 bichinhos na ordem certa!</p>

    <!-- Slots da senha -->
    <div class="senha-slots" id="senha-slots">
      <div class="slot" data-index="0" onclick="App.removeSlot(0)">❓</div>
      <div class="slot" data-index="1" onclick="App.removeSlot(1)">❓</div>
      <div class="slot" data-index="2" onclick="App.removeSlot(2)">❓</div>
    </div>

    <!-- Grade de animais -->
    <div class="animais-grid" id="animais-grid">
      <!-- Gerado via JS -->
    </div>

    <button class="btn-voltar" onclick="App.goTo('exploradores')">
      ← Voltar
    </button>
  </section>

  <div id="modal-overlay" class="modal-overlay" onclick="App.closeModal(event)">
    <div class="modal-content">
      <div id="modal-emoji" style="font-size: 3rem; margin-bottom: 1rem;"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <button id="modal-action" class="btn-novo"></button>
    </div>
  </div>
  
  <script src="../assets/javascript/script.js"></script>
</body>
</html>
